<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>섯다</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--blk:#4a5238;--blk2:#2f3624;--cream:#f2ead3;--ink:#1d1a16;--red:#c8372d;--gold:#e0b340}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:var(--cream);font:16px/1.4 system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.07) 46px 48px),linear-gradient(var(--blk),var(--blk2));
padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
h1,.big{font-family:'Black Han Sans',system-ui,sans-serif;font-weight:400}
#lobby{max-width:360px;margin:0 auto;padding-top:10vh;text-align:center}
h1{font-size:64px;margin:0;letter-spacing:4px;border-bottom:6px solid var(--red);display:inline-block;padding:0 12px}
button,input{font:inherit;border-radius:6px;border:2px solid var(--ink);padding:12px 16px;margin:6px 4px}
button{background:var(--cream);color:var(--ink);font-weight:700;cursor:pointer}
button:disabled{opacity:.5}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
button.r{background:var(--red);color:var(--cream)}button.d{background:transparent;color:var(--cream);border-color:var(--cream)}
input{width:130px;text-align:center;background:var(--cream);color:var(--ink)}
#mk{width:100%;margin:16px 0 8px;font-size:18px}[hidden]{display:none!important}
.big{font-size:56px;color:var(--gold);letter-spacing:6px}
#st{text-align:center;min-height:1.4em;margin:8px 0}
#game{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px}.row b{color:var(--gold)}
.cards{display:flex;gap:10px;justify-content:center;min-height:118px}
.card{position:relative;width:76px;height:118px;border-radius:5px;overflow:hidden}
.card img{display:block;width:100%;height:100%}
.card b{position:absolute;left:3px;top:3px;padding:0 6px;height:18px;border-radius:9px;background:var(--cream);color:var(--ink);font:700 12px/18px system-ui;text-align:center;box-shadow:0 0 0 1px var(--ink)}
.card.back{background:repeating-linear-gradient(45deg,var(--red) 0 8px,#8f251e 8px 16px);border:2px solid var(--cream)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold)}.card.dim{opacity:.4}
.card.opn::after{content:'공개';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--cream);font-size:10px;padding:0 6px;border-radius:6px}
#mcards.pk .card{cursor:pointer}
.act{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;font-size:12px;border-radius:10px;padding:0 8px;min-height:18px;line-height:18px}.act:empty{visibility:hidden}
.pl2{list-style:none;padding:0;margin:14px 0}.pl2 li{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.25);border:2px solid rgba(242,234,211,.35);border-radius:8px;padding:12px 14px;margin:8px 0;font-weight:700;text-align:left}
.pl2 li.me{border-color:var(--gold)}.pl2 li.em{opacity:.45;border-style:dashed;font-weight:400}.pl2 small{opacity:.8;font-weight:400}
.opp>b{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.opps{display:flex;gap:6px}
.opp{flex:1;min-width:0;border:2px solid rgba(242,234,211,.3);border-radius:8px;padding:6px 2px;text-align:center;font-size:12px}
.opp.t{border-color:var(--gold);background:rgba(0,0,0,.2)}.opp.x{opacity:.5}
.opp.w{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,179,64,.5)}
.opp .cards{gap:3px;min-height:0;margin:4px 0}.opp .card{width:38px;height:59px}.opp .card b,.pr .card b,#opts .card b{font-size:9px;height:12px;line-height:12px;padding:0 3px;left:1px;top:1px;box-shadow:none}.opp .card.opn::after{display:none}
.mid{text-align:center;padding:10px;border-top:2px dashed rgba(242,234,211,.35);border-bottom:2px dashed rgba(242,234,211,.35)}
.mid .big{font-size:36px;letter-spacing:0}#msg{min-height:44px;margin-top:4px}.rs{font-size:20px;font-weight:700;color:var(--gold)}
#lg{font-size:12px;opacity:.85;min-height:1.3em}
#hname{text-align:center;font-weight:700;color:var(--gold);min-height:1.4em}#wr{text-align:center;font-size:14px;min-height:1.3em}
#opts{display:flex;flex-direction:column;gap:6px}#opts button{display:flex;align-items:center;gap:12px;text-align:left;margin:0}
#opts .cards{min-height:0;gap:4px}#opts .card{width:38px;height:59px}#opts button.on{outline:3px solid var(--gold);background:#fff4c8}#opts em{font-style:normal;margin-left:auto;font-size:14px}
#acts{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
#pop{position:fixed;inset:0;z-index:9;overflow:auto;background:linear-gradient(var(--blk2),#1d2216);padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px)}
#pop h2{margin:0 0 6px;font:28px 'Black Han Sans',sans-serif}#pn{font-size:13px;opacity:.85;margin:0 50px 12px 0}
#px{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:44px;height:44px;border-radius:50%;padding:0;font-size:22px;line-height:1;z-index:10}
.pr{padding:8px;border-radius:8px;border:2px solid transparent;margin-bottom:6px}
.pr.me{border-color:var(--gold);background:rgba(224,179,64,.22)}
.pr .rw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0}.pr .cards{min-height:0;gap:2px;flex:none}.pr .card{width:36px;height:56px}.pr .pl{font-weight:700;font-size:18px}
.ln{display:flex;align-items:center;gap:8px;color:#8fc4ff;font-size:14px;font-weight:700;margin:8px 0}.ln::before,.ln::after{content:'';flex:1;border-top:2px solid #5aa0e8}
.pr em{font-style:normal;font-size:12px;opacity:.85;display:block}.pr .tag{color:var(--gold);font-weight:700;font-size:13px;margin-left:8px}
.table{display:grid;gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"l t r" "l p r";align-items:start}
.opps{display:contents}.potbox{grid-area:p;text-align:center;align-self:center;padding:4px 0}.potbox .big{font-size:30px;letter-spacing:0}
#potstk{min-height:44px;display:flex;justify-content:center;align-items:flex-end}
.opp .card{width:28px;height:43px;border-radius:3px}.opp .cards{gap:2px}
.opp .oc{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:30px;justify-content:flex-end}.opp>small{opacity:.85}
.stk{display:flex;align-items:flex-end;justify-content:center;gap:3px;min-height:calc(var(--w)*.7)}
.col{display:flex;flex-direction:column-reverse;align-items:center}.col small{font-size:10px;margin-top:2px}
.ch{display:block;width:var(--w);height:calc(var(--w)*.55);border-radius:50%;background:var(--cc);border:calc(var(--w)*.09) solid var(--ce);box-shadow:0 calc(var(--w)*.08) 0 rgba(0,0,0,.5),inset 0 0 0 calc(var(--w)*.07) rgba(255,255,255,.5);margin-top:calc(var(--w)*-.3)}
.c10{--cc:#e9e4d3;--ce:#9b9684}.c50{--cc:#d33a2f;--ce:#8f1d16}.c1h{--cc:#2c6fd0;--ce:#16407d}.c5h{--cc:#2f9a4f;--ce:#176b31}
.ch.fly{position:fixed;left:0;top:0;z-index:30;pointer-events:none;margin:0}
.mychips{display:flex;align-items:center;justify-content:center;gap:14px;min-height:44px}.mychips b{font-size:22px;color:var(--gold)}
#acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;bottom:0;z-index:5;padding:8px 0 calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(rgba(47,54,36,0),var(--blk2) 22%);margin-bottom:0}
#acts button{margin:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;line-height:1.15;background:#3b4330;color:var(--cream);border-color:#2a3020}
#acts button b{font-size:16px}#acts button small{font-size:12px;min-height:14px}
#acts button:disabled{opacity:.35;filter:grayscale(.7)}
#acts button.lit{background:var(--cream);color:var(--ink);border-color:var(--gold);box-shadow:0 0 14px 3px rgba(224,179,64,.85)}
#acts button.lit.r{background:var(--red);color:var(--cream)}#acts button.lit.die{background:#5a2a24;color:var(--cream);border-color:#ff9a8f;box-shadow:0 0 12px 2px rgba(255,120,100,.7)}
#acts2{display:flex;flex-wrap:wrap;justify-content:center}
.pr .sp{background:var(--red);color:var(--cream);font-size:11px;padding:1px 6px;border-radius:8px;margin-left:6px}
</style></head><body>
<p id="st"></p>
<div id="lobby">
<h1>섯다</h1>
<div id="entry">
<p>2~4명이 함께하는 섯다. 로그인 필요 없어요.</p>
<input id="nick" maxlength="8" placeholder="닉네임 (최대 8자)" autocomplete="off" style="width:100%;margin:4px 0 10px">
<button id="rs" class="r" hidden></button><button id="rj" class="r" hidden></button>
<p>게임 방식</p><div id="md"><button data-m="2" class="r">2장 섯다</button><button data-m="3" class="d">3장 섯다</button></div>
<button id="mk" class="r">방 만들기</button>
<p>친구가 만든 방에 들어가기</p>
<input id="code" inputmode="numeric" maxlength="4" placeholder="코드 4자리"><button id="jn">입장</button>
<p>먼저 해보기</p><button id="ts" class="d">혼자 테스트 (4자리)</button>
</div>
<div id="hl" hidden><p>대기실 · 방 코드</p><div class="big" id="cd"></div><p id="cnt"></p>
<ul class="pl2" id="pl2"></ul>
<button id="go" class="r" disabled>게임 시작</button><p id="wt" hidden>방장이 게임을 시작하길 기다리는 중…</p>
<button id="lv" class="d">방 나가기</button></div>
</div>
<div id="game" hidden>
<div style="text-align:right"><button id="pb" class="d">족보 보기</button></div>
<div class="table" id="tbl"><div class="opps" id="opps"></div><div class="potbox"><div id="potstk"></div><div>판돈 <span class="big" id="pot"></span></div></div></div>
<div class="mid"><div id="msg"></div><div id="lg"></div></div>
<div id="me"><div class="mychips"><div id="mstk"></div><div><div>내 칩 <b id="mc"></b></div><div><span class="act" id="ml"></span> <small>베팅 <b id="mb"></b></small></div></div></div>
<div class="cards" id="mcards"></div><div id="hname"></div><div id="wr"></div></div>
<div id="opts"></div><div id="acts2"></div><div id="acts"></div>
</div>
<div id="pop" hidden role="dialog" aria-label="족보"><button id="px" aria-label="닫기">✕</button><h2>족보</h2><p id="pn"></p><div id="pl"></div></div>

['구삥','구삥','1 + 9',[[[1,0],[1,1]],[[9,0],[9,1]]]],
['장삥','장삥','1 + 10',[[[1,0],[1,1]],[[10,0],[10,1]]]],
['장사','장사','4 + 10',[[[4,0],[4,1]],[[10,0],[10,1]]]],
['세륙','세륙','4 + 6',[[[4,0],[4,1]],[[6,0],[6,1]]]],
['끗','갑오(9끗) ~ 망통','위 족보가 없으면 두 장 합의 일의 자리로 겨뤄요 (9끗이 가장 높아요)',[]]];
const pkey=n=>/^\d땡$/.test(n)?'땡':/끗|망통/.test(n)?'끗':n;
function buildPop(){const k=pkey(curHand);
 $('pn').textContent='위쪽일수록 강해요. 같은 패끼리 무승부면 판돈을 유지하고 그 사람들끼리 두 장 섯다로 재경기해요. 그림에 한 월의 두 장이 같이 나오면 둘 중 아무 카드나 돼요. 재경기는 구사나 멍텅구리구사가 있는데 다른 사람의 최고 패가 파란 "이하 재경기" 줄 아래일 때예요. 이때는 판을 무효로 하고 판돈을 돌려받은 뒤 다시 해요.'+(V&&V.mode==3?' 3장 섯다는 세 장 중 두 장으로 패를 만들어요.':'');
 $('pl').innerHTML=PR.map(r=>r[0]===0?`<div class="ln">${r[1]}</div>`:`<div class="pr${r[0]==k?' me':''}"><b>${r[1]}</b>${['암행어사','땡잡이'].includes(r[0])?'<span class="sp">특수</span>':''}${r[0]==k?'<span class="tag">◀ 내 패 ('+curHand+')</span>':''}${r[3].length?'<div class="rw">'+r[3].map((g,gi)=>typeof g=='string'?`<span class="pl">${g}</span>`:(gi&&typeof r[3][gi-1]!='string'?'<span class="pl">+</span>':'')+`<span class="cards">${g.map(([m,v],i)=>card({m,v},i)).join('')}</span>`).join('')+'</div>':''}${r[2]?`<em>${r[2]}</em>`:''}</div>`).join('')}
$('pb').onclick=()=>{buildPop();$('pop').hidden=false};$('px').onclick=()=>$('pop').hidden=true;
onkeydown=e=>{if(e.key=='Escape')$('pop').hidden=true};
/* ---- network: host ---- */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cl=t=>String(t||'').trim().slice(0,8)||'손님';
const uniq=(n,ex)=>{let r=n,i=2;while(ex.includes(r))r=n.slice(0,7)+i++;return r};
const nickv=()=>$('nick').value.trim().slice(0,8);
function need(){const n=nickv();if(!n){st('닉네임을 먼저 입력해 주세요');$('nick').focus();return false}nick=n;localStorage.sd_nick=n;return true}
function showRoom(code,md,names,you){$('entry').hidden=true;$('hl').hidden=false;$('cd').textContent=code;$('cnt').textContent=md+'장 섯다 · '+names.length+'/4명';
 $('pl2').innerHTML=[0,1,2,3].map(i=>i<names.length?`<li class="${i==you?'me':''}"><span>${esc(names[i])}${i==you?' (나)':''}</span><small>${i==0?'방장':'참가자'}</small></li>`:'<li class="em"><span>참가자를 기다리는 중…</span></li>').join('');
 $('go').hidden=you!=0;$('wt').hidden=you==0;$('go').disabled=names.length<2}
function lobbyUpd(){const og=gs.filter(g=>g.c.open),names=[nick,...og.map(g=>g.nick)];showRoom(room,mode,names,0);
 og.forEach((g,i)=>g.c.send({wait:names.length,mode,names,code:room,you:i+1}))}
const rej=c=>{try{c.send({full:1})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400)};
function hello(c,tok,nk){if(tok==TOK)return rej(c);
 if(S.started){const s=S.tok.indexOf(tok);if(s<1)return rej(c);const o=conns[s];conns[s]=c;if(o&&o!==c)try{o.close()}catch(e){}S.dc[s]=false;rx[s]=Date.now();push();return}
 const i=gs.findIndex(g=>g.tok==tok);
 if(i>=0){const o=gs[i].c;gs[i].c=c;if(o!==c)try{o.close()}catch(e){}}else if(gs.length>=3)return rej(c);else gs.push({c,tok,nick:uniq(cl(nk),[nick,...gs.map(g=>g.nick)])});
 lobbyUpd()}
function hdata(c,d){if(d.hello)return hello(c,d.hello,d.nick);const s=conns.indexOf(c);if(s>0)rx[s]=Date.now();if(!S.started||s<1||d.pong)return;d.a=='next'?nextHand():act(s,d.a,d.t,d.n)}
function hclose(c){if(S.started){const s=conns.indexOf(c);if(s>0){conns[s]=null;drop(s)}}else{gs=gs.filter(g=>g.c!==c);lobbyUpd()}}
function host(code,saved,tries=0){code=code||String(Math.random()*9000+1000|0);room=code;st('방 만드는 중…');me=0;guest=false;
 if(saved){S=saved;nick=(S.names=S.names||S.chips.map((_,s)=>(s+1)+'번'))[0];S.st=S.st||S.chips.map(()=>0);S.dc=S.dc.map((d,s)=>s>0);S.dcAt=S.dc.map(()=>Date.now());conns=[];mode=S.mode}else{S={started:false};localStorage.removeItem('sd_h')}
 peer=new Peer('seotda'+code);
 peer.on('open',()=>{st('');if(saved){const w=S.phase=='wait';if(w)S.phase='bet';timers();if(w)nextTurn(S.dealer);if(S.phase=='over'&&S.res&&(S.res.why=='tie'||S.res.why=='redeal'))startRematch();else push();return}
  $('entry').hidden=true;$('hl').hidden=false;$('cd').textContent=code;lobbyUpd();timers()});
 peer.on('connection',c=>{c.on('data',d=>hdata(c,d));c.on('close',()=>hclose(c))});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();if(!saved)host();else if(tries<20){st('이전 연결이 정리되길 기다리는 중…');setTimeout(()=>host(code,saved,tries+1),3000)}else st('방을 이어가지 못했어요. 새로 만들어 주세요.')}
  else if(e.type!='peer-unavailable')st('연결 오류: '+e.type)})}
$('mk').onclick=()=>{if(need())host()};
$('rs').onclick=()=>{try{const h=JSON.parse(localStorage.sd_h);mode=h.S.mode;host(h.room,h.S)}catch(e){st('저장된 방이 없어요')}};
$('go').onclick=()=>{gs=gs.filter(g=>g.c.open);conns=[null,...gs.map(g=>g.c)];const n=1+gs.length;
 S={started:true,mode,n,chips:Array(n).fill(1000),dc:Array(n).fill(false),dcAt:Array(n).fill(0),st:Array(n).fill(0),tok:[TOK,...gs.map(g=>g.tok)],names:[nick,...gs.map(g=>g.nick)],dealer:n-1};
 conns.forEach((c,s)=>{if(c)rx[s]=Date.now()});deal()};
/* ---- network: guest ---- */
function retry(){if(!guest)return;st('연결이 끊겼어요. 다시 연결하는 중…');clearTimeout(rt);rt=setTimeout(connect,2000)}
function connect(){if(!guest)return;const go=()=>{const mine=conn=peer.connect('seotda'+room,{reliable:true});
  mine.on('open',()=>{lastRx=Date.now();mine.send({hello:TOK,nick})});
  mine.on('data',d=>{lastRx=Date.now();if(d.ping){mine.send({pong:1});return}
   if(d.full){guest=false;joining=false;$('jn').disabled=false;localStorage.removeItem('sd_g');st('입장할 수 없어요. 방이 가득 찼거나 이미 시작됐어요.');return}
   ever=true;localStorage.sd_g=room;if(d.wait){mode=d.mode;st('');showRoom(d.code,d.mode,d.names,d.you)}else{V=d;render()}});
  mine.on('close',()=>{if(mine===conn)retry()});mine.on('error',()=>{if(mine===conn)retry()})};
 if(peer&&!peer.destroyed&&!peer.disconnected&&peer.open)go();
 else{try{peer&&peer.destroy()}catch(e){}peer=new Peer();peer.on('open',go);peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type=='peer-unavailable'&&!ever){guest=false;joining=false;$('jn').disabled=false;st('그 코드의 방이 없어요. 코드를 다시 확인해 주세요.')}else retry()})}}
function join(c){if(joining)return;joining=true;$('jn').disabled=true;guest=true;room=c;ever=false;st('연결 중…');connect()}
$('jn').onclick=()=>{if(!need())return;const c=$('code').value.trim();if(c.length!=4)return st('코드 4자리를 입력해 주세요');join(c)};
$('rj').onclick=()=>{if(need())join(localStorage.sd_g)};
$('lv').onclick=()=>{guest=false;try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}localStorage.removeItem('sd_g');localStorage.removeItem('sd_h');location.reload()};
setInterval(()=>{if(guest&&ever&&conn&&Date.now()-lastRx>12000){try{conn.close()}catch(e){}retry()}},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&guest&&ever&&(!conn||!conn.open))retry()});
/* ---- misc ---- */
$('nick').value=localStorage.sd_nick||'';
$('md').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;[...$('md').children].forEach(x=>x.className=x==b?'r':'d')};
$('ts').onclick=()=>{test=true;me=0;S={started:true,mode,n:4,chips:Array(4).fill(1000),dc:Array(4).fill(false),dcAt:Array(4).fill(0),st:Array(4).fill(0),tok:[],names:[nickv()||'1번','2번','3번','4번'],dealer:3};deal()};
try{const h=JSON.parse(localStorage.sd_h||'null');if(h&&h.S&&h.S.started){$('rs').hidden=false;$('rs').textContent='내 방 이어하기 ('+h.room+')'}}catch(e){}
if(localStorage.sd_g){$('rj').hidden=false;$('rj').textContent='이전 방 다시 입장 ('+localStorage.sd_g+')'}
</script></body></html>
