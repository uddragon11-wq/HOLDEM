const alive=s=>S.chips[s]>0&&!S.dc[s],left=()=>S.in.filter(Boolean).length;
const cur=()=>Math.max(0,...S.bets.filter((b,s)=>S.in[s])),done=s=>S.bets[s]==cur()&&(S.acted[s]||S.chips[s]==0);

 S.hands=S.in.map(x=>x?Array.from({length:S.mode},()=>d[k++]):null);S.pick=S.in.map(()=>null);S.bets=S.in.map(x=>x?10:0);S.chips=S.chips.map((c,s)=>S.in[s]?c-10:c);
 S.acted=S.in.map(()=>false);S.phase='bet';S.res=null;S.reveal=false;S.over=false;nextTurn(S.dealer);push()}

 for(const s of L)if(cmp(fh(s),fh(c))>0)c=s;return L.filter(s=>cmp(fh(c),fh(s))==0)}

 else if(a=='check'&&B[p]==c)S.acted[p]=true;
 else if(a=='call'&&B[p]<c){C[p]-=c-B[p];B[p]=c;S.acted[p]=true}
 else if(a=='raise'){T=Math.min(T,cap());if(T<=c)return;C[p]-=T-B[p];B[p]=T;S.acted=S.acted.map((_,s)=>s==p)}
 else return;
 nextTurn(p);push()}

 if(S.in[s]&&(S.phase=='bet'||S.phase=='pick')){S.in[s]=false;if(left()==1)return finish([S.in.indexOf(true)],'die');
  if(S.phase=='pick')return pickCheck();
  if(S.turn==s)nextTurn(s);else if(S.in.every((x,t)=>!x||done(t)))return endBet()}
 push()}
function nextHand(){if(!S||S.phase!='over')return;if(S.over)S.chips=S.chips.map(()=>1000);deal()}
const view=i=>({me:i,chips:S.chips,bets:S.bets,in:S.in,turn:S.turn,phase:S.phase,my:S.hands[i],
 hands:S.reveal?S.hands.map((h,s)=>S.in[s]?h:null):null,res:S.res,over:S.over,dc:S.dc,cur:cur(),mode:S.mode,pk:S.reveal?S.pick:null,mp:S.pick[i],pend:S.in.map((x,s)=>x&&!S.pick[s])});

const w=(a,b)=>'<g stroke="'+a+'" stroke-width="2.5" fill="none"><path d="M6 6q14 2 28 0M12 6v22M20 6v28M28 6v20"/></g><g fill="'+b+'"><ellipse cx="12" cy="26" rx="3" ry="6"/><ellipse cx="20" cy="31" rx="3" ry="6"/><ellipse cx="28" cy="24" rx="3" ry="6"/></g>';

'<path d="M20 6l-9 12h5l-7 10h22l-7-10h5z" fill="#2f6b3a"/><circle cx="31" cy="9" r="5" fill="#c8372d"/><rect x="18" y="28" width="4" height="8" fill="#6b4a2b"/>',

'<g fill="#f4a0b5"><circle cx="13" cy="26" r="7"/><circle cx="26" cy="20" r="7"/><circle cx="24" cy="32" r="5"/></g><path d="M0 4h40v7H0z" fill="#c8372d"/>',
w('#2a2330','#5b3f7a'),
'<g stroke="#2f6b3a" stroke-width="2.5" fill="none"><path d="M8 36C12 18 18 10 30 6M14 36C16 22 24 14 34 14"/></g><circle cx="30" cy="8" r="4" fill="#c8372d"/>',
'<circle cx="20" cy="20" r="11" fill="#d94a6b"/><circle cx="20" cy="20" r="6" fill="#f08aa0"/><circle cx="20" cy="20" r="2.5" fill="#f6d36b"/><path d="M4 34l10-6M36 34l-10-6" stroke="#2f6b3a" stroke-width="3"/>',

'<g fill="#f6c63b"><circle cx="20" cy="11" r="5"/><circle cx="11" cy="20" r="5"/><circle cx="29" cy="20" r="5"/><circle cx="20" cy="29" r="5"/></g><circle cx="20" cy="20" r="5" fill="#c8372d"/>',
'<path d="M20 4l4 9 8-3-3 9 8 2-9 5 3 9-11-5-11 5 3-9-9-5 8-2-3-9 8 3z" fill="#c8372d"/>'];

const card=(c,i)=>c.b?'<div class="card back"></div>':`<div class="card ${c.t}" data-i="${i}"><b>${c.m}</b><svg viewBox="0 0 40 40">${A[c.m]}</svg><span>${c.t=='g'?'광':c.t=='y'?'열끗':''}</span></div>`;

function render(){$('lobby').hidden=true;$('game').hidden=false;
 const m=V.me,B=V.bets,C=V.chips,pot=B.reduce((a,b)=>a+b,0),my=V.my||[],md=V.mode,fin=(h,s)=>md==3&&V.pk&&V.pk[s]?V.pk[s].map(i=>h[i]):h;

  c.on('close',()=>{if(S.started)drop(conns.indexOf(c));else{gs=gs.filter(x=>x!=c);lobbyUpd()}})});
 peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();host()}else st('연결 오류: '+e.type)})};
$('go').onclick=()=>{gs=gs.filter(g=>g.open);conns=[null,...gs];const n=1+gs.length;
 S={started:true,mode,n,chips:Array(n).fill(1000),dc:Array(n).fill(false),dealer:n-1};deal()};
$('jn').onclick=()=>{const c=$('code').value.trim();if(c.length!=4)return st('코드 4자리를 입력해 주세요');guest=true;st('연결 중…');peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('seotda'+c,{reliable:true});
  conn.on('data',d=>{if(d.wait)st(d.mode+'장 섯다 · 방장이 게임을 시작하길 기다리는 중 · 현재 '+d.wait+'명');else{V=d;render()}});
  conn.on('close',()=>st('연결이 끊겼어요. 새로고침하고 다시 입장해 주세요.'))});
 peer.on('error',e=>st(e.type=='peer-unavailable'?'그 코드의 방이 없어요. 코드를 다시 확인해 주세요.':'연결 오류: '+e.type))};
const PR=[['38광땡','38광땡','3광+8광',[[3,'g'],[8,'g']]],['18광땡','18광땡','1광+8광',[[1,'g'],[8,'g']]],['13광땡','13광땡','1광+3광',[[1,'g'],[3,'g']]],
['장땡','장땡','10+10',[[10,'n'],[10,'n']]],['땡','9땡 ~ 1땡','같은 월 두 장 (숫자가 큰 쪽이 위)',[[9,'n'],[9,'n']]],
['알리','알리','1+2',[[1,'n'],[2,'n']]],['독사','독사','1+4',[[1,'n'],[4,'n']]],['구삥','구삥','1+9',[[1,'n'],[9,'n']]],['장삥','장삥','1+10',[[1,'n'],[10,'n']]],['장사','장사','4+10',[[4,'n'],[10,'n']]],['세륙','세륙','4+6',[[4,'n'],[6,'n']]],
['끗','갑오(9끗) ~ 망통','두 장 합의 일의 자리 (9끗이 가장 높아요)',[[4,'n'],[5,'n']]],
['암행어사','암행어사','4열끗+7열끗. 18·13광땡을 이겨요',[[4,'y'],[7,'y']]],['땡잡이','땡잡이','3광+7열끗. 1~9땡을 이겨요',[[3,'g'],[7,'y']]]];
const pkey=n=>/^\d땡$/.test(n)?'땡':/끗|망통/.test(n)?'끗':n;
function buildPop(){const k=pkey(curHand);
 $('pn').textContent='위쪽일수록 강해요. 같은 패끼리는 무승부(판돈 나눔)이고 구사 재경기는 없어요.'+(V&&V.mode==3?' 3장 섯다는 세 장 중 두 장을 골라 승부해요.':'');
 $('pl').innerHTML=PR.map(([key,t,d,cs])=>`<div class="pr${key==k?' me':''}"><div class="cards">${cs.map(([m,tt],i)=>card({m,t:tt},i)).join('')}</div><div><b>${t}</b><em>${d}</em></div>${key==k?'<span class="tag">◀ 내 패 ('+curHand+')</span>':''}</div>`).join('')}
$('pb').onclick=()=>{buildPop();$('pop').hidden=false};$('px').onclick=()=>$('pop').hidden=true;
onkeydown=e=>{if(e.key=='Escape')$('pop').hidden=true};
$('md').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;[...$('md').children].forEach(x=>x.className=x==b?'r':'d')};
$('mcards').onclick=e=>{const c=e.target.closest('.card');if(!c||!V||V.phase!='pick'||V.mp||!V.my)return;const j=+c.dataset.i;sel=sel.includes(j)?sel.filter(x=>x!=j):[...sel,j].slice(-2);render()};
$('ts').onclick=()=>{test=true;me=0;S={started:true,mode,n:4,chips:Array(4).fill(1000),dc:Array(4).fill(false),dealer:3};deal()};
